<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your Fly Nexus LLP password. Enter your email to receive a reset link.">
    <title>Fly Nexus LLP — Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .form-group input[type="email"] {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .form-group input[type="email"]:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .info-text {
            color: var(--text-secondary);
            font-size: 0.88rem;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .success-icon {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 16px;
            animation: fadeIn 0.5s ease;
        }

        .success-message {
            text-align: center;
            color: var(--success);
            font-size: 0.95rem;
            line-height: 1.6;
            animation: slideIn 0.3s ease;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">Fly Nexus LLP</div>
            <p class="subtitle">Password Recovery</p>
        </div>

        <!-- Alert Messages -->
        <div id="alert" class="alert"></div>

        <!-- Forgot Password Card -->
        <div class="card" style="max-width: 440px; margin: 0 auto;">
            <div id="formSection">
                <h2 class="card-title">🔑 Reset Your Password</h2>
                <p class="info-text">
                    Enter the email address associated with your account. We'll send you a link to create a new
                    password.
                </p>
                <form id="forgotForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        Send Reset Link
                    </button>
                </form>
            </div>

            <div id="successSection" style="display: none;">
                <div class="success-icon">📧</div>
                <p class="success-message">
                    If an account with that email exists, we've sent a password reset link.<br>
                    Please check your inbox (and spam folder).
                </p>
            </div>
        </div>

        <!-- Nav -->
        <div class="nav-links">
            <a href="/login.html">← Back to Login</a>
        </div>
    </div>

    <script>
        const alertEl = document.getElementById('alert');

        function showAlert(message, type) {
            alertEl.textContent = message;
            alertEl.className = `alert alert-${type} show`;
            setTimeout(() => alertEl.classList.remove('show'), 5000);
        }

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('submitBtn');

            btn.innerHTML = '<span class="spinner"></span> Sending...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/user/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });

                const data = await res.json();

                if (!res.ok) {
                    showAlert(data.error || 'Something went wrong.', 'error');
                    btn.innerHTML = 'Send Reset Link';
                    btn.disabled = false;
                    return;
                }

                // Show success state
                document.getElementById('formSection').style.display = 'none';
                document.getElementById('successSection').style.display = 'block';
            } catch (err) {
                showAlert('Network error. Please try again.', 'error');
                btn.innerHTML = 'Send Reset Link';
                btn.disabled = false;
            }
        });
    </script>

</body>

</html>
