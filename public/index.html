<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Access password-protected short URLs by serial number. Secure, fast, and simple.">
    <title>Fly Nexus LLP — Secure Short URL Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <script>
        // ─── Auto-redirect based on auth state ──────────────────────
        // If user is logged in (has a valid token), go to home.
        // Otherwise, go to login page.
        const token = localStorage.getItem('userToken');
        if (token) {
            window.location.replace('/home.html');
        } else {
            window.location.replace('/login.html');
        }
    </script>
</body>

</html>
