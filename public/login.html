<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in or register for Fly Nexus LLP to access secure short URL tools.">
    <title>Fly Nexus LLP — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .auth-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 28px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .auth-tab {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            background: transparent;
            color: var(--text-muted);
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
        }

        .auth-tab:not(:last-child) {
            border-right: 1px solid var(--border-color);
        }

        .auth-tab.active {
            background: rgba(108, 92, 231, 0.12);
            color: var(--accent);
        }

        .auth-tab:hover:not(.active) {
            background: rgba(108, 92, 231, 0.05);
            color: var(--text-secondary);
        }

        .auth-panel {
            display: none;
            animation: slideIn 0.3s ease;
        }

        .auth-panel.active {
            display: block;
        }

        .forgot-link {
            display: block;
            text-align: right;
            margin-top: -12px;
            margin-bottom: 20px;
            font-size: 0.82rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: color var(--transition);
        }

        .forgot-link:hover {
            color: var(--accent);
        }

        .form-group input[type="email"] {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .form-group input[type="email"]:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .password-strength {
            height: 3px;
            border-radius: 2px;
            margin-top: 6px;
            background: var(--border-color);
            overflow: hidden;
            transition: all var(--transition);
        }

        .password-strength .bar {
            height: 100%;
            width: 0;
            border-radius: 2px;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .strength-weak .bar {
            width: 33%;
            background: var(--error);
        }

        .strength-medium .bar {
            width: 66%;
            background: var(--warning);
        }

        .strength-strong .bar {
            width: 100%;
            background: var(--success);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">Fly Nexus LLP</div>
            <p class="subtitle">Secure short URL management platform</p>
        </div>

        <!-- Alert Messages -->
        <div id="alert" class="alert"></div>

        <!-- Auth Card -->
        <div class="card" style="max-width: 440px; margin: 0 auto;">
            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
                <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">Create Account</button>
            </div>

            <!-- ─── Login Panel ─── -->
            <div class="auth-panel active" id="loginPanel">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" name="email" placeholder="you@example.com" required autofocus>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>
                    </div>
                    <a href="/forgot-password.html" class="forgot-link">Forgot password?</a>
                    <button type="submit" class="btn btn-primary" id="loginBtn">
                        Sign In
                    </button>
                </form>
            </div>

            <!-- ─── Register Panel ─── -->
            <div class="auth-panel" id="registerPanel">
                <form id="registerForm">
                    <div class="form-group">
                        <label for="regEmail">Email</label>
                        <input type="email" id="regEmail" name="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <input type="password" id="regPassword" name="password" placeholder="Min 6 characters" required
                            minlength="6" oninput="checkStrength(this.value)">
                        <div class="password-strength" id="passwordStrength">
                            <div class="bar"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="regConfirmPassword">Confirm Password</label>
                        <input type="password" id="regConfirmPassword" name="confirmPassword"
                            placeholder="Re-enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary" id="registerBtn">
                        Create Account
                    </button>
                </form>
            </div>
        </div>

        <!-- Nav -->
        <div class="nav-links">
            <a href="/admin.html">Admin Panel →</a>
        </div>
    </div>

    <script>
        const alertEl = document.getElementById('alert');

        function showAlert(message, type) {
            alertEl.textContent = message;
            alertEl.className = `alert alert-${type} show`;
            setTimeout(() => alertEl.classList.remove('show'), 5000);
        }

        // ─── Check if already logged in ─────────────────────────────
        (function () {
            const token = localStorage.getItem('userToken');
            if (token) {
                window.location.href = '/home.html';
            }
        })();

        // ─── Tab Switching ──────────────────────────────────────────
        function switchTab(tab) {
            document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
            document.getElementById('loginPanel').classList.toggle('active', tab === 'login');
            document.getElementById('registerPanel').classList.toggle('active', tab === 'register');
        }

        // ─── Password Strength ──────────────────────────────────────
        function checkStrength(value) {
            const el = document.getElementById('passwordStrength');
            el.className = 'password-strength';

            if (value.length === 0) return;
            if (value.length < 6) {
                el.classList.add('strength-weak');
            } else if (value.length < 10 || !/[A-Z]/.test(value) || !/[0-9]/.test(value)) {
                el.classList.add('strength-medium');
            } else {
                el.classList.add('strength-strong');
            }
        }

        // ─── Login ──────────────────────────────────────────────────
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const btn = document.getElementById('loginBtn');

            btn.innerHTML = '<span class="spinner"></span> Signing in...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/user/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });

                const data = await res.json();

                if (!res.ok) {
                    showAlert(data.error || 'Login failed.', 'error');
                    return;
                }

                localStorage.setItem('userToken', data.token);
                localStorage.setItem('userEmail', data.email);
                showAlert('Login successful! Redirecting...', 'success');
                setTimeout(() => window.location.href = '/home.html', 500);
            } catch (err) {
                showAlert('Network error. Please try again.', 'error');
            } finally {
                btn.innerHTML = 'Sign In';
                btn.disabled = false;
            }
        });

        // ─── Register ───────────────────────────────────────────────
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const confirmPassword = document.getElementById('regConfirmPassword').value.trim();
            const btn = document.getElementById('registerBtn');

            if (password !== confirmPassword) {
                showAlert('Passwords do not match.', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('Password must be at least 6 characters.', 'error');
                return;
            }

            btn.innerHTML = '<span class="spinner"></span> Creating account...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/user/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });

                const data = await res.json();

                if (!res.ok) {
                    showAlert(data.error || 'Registration failed.', 'error');
                    return;
                }

                localStorage.setItem('userToken', data.token);
                localStorage.setItem('userEmail', data.email);
                showAlert('Account created! Redirecting...', 'success');
                setTimeout(() => window.location.href = '/home.html', 500);
            } catch (err) {
                showAlert('Network error. Please try again.', 'error');
            } finally {
                btn.innerHTML = 'Create Account';
                btn.disabled = false;
            }
        });
    </script>

</body>

</html>
